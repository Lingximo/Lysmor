name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile core Python files
        run: |
          python -m py_compile configure.py
          python -m py_compile open_entry.py
          python -m py_compile setup/server.py

      - name: Compile example services
        run: |
          Get-ChildItem services -Recurse -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }

      - name: Compile nirvana tools
        run: |
          Get-ChildItem tools/nirvana -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }

      - name: Validate JSON templates
        run: |
          python -c "import json, glob; [json.load(open(p, encoding='utf-8-sig')) for p in glob.glob('*.json') + glob.glob('config/*.json') + glob.glob('services/**/*.json', recursive=True) + glob.glob('docs/*.json')]; print('JSON OK')"
