<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="panels.house_title">TA · 大平层</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%9F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css?v=1">
<script src="/i18n.js"></script>
</head>
<body>
<div id="panel-language" style="position:fixed;right:12px;bottom:8px;z-index:50;pointer-events:auto"></div>
<script>LysmorI18n.mountLanguageSelector(document.getElementById("panel-language"));</script>
<div id="app">
  <header>
    <div class="brand"><i class="dot"></i><span><span data-i18n="panels.house_title">TA · 大平层</span></span><a href="/3d" class="to3d"><span data-i18n="panels.view_3d">3D 视角 →</span></a></div>
    <div class="clock">
      <span id="clock">--:--</span>
      <span class="mode" id="mode"><span data-i18n="panels.daytime">白天</span></span>
    </div>
  </header>

  <main>
    <div class="stage" id="stage">
      <canvas id="house"></canvas>
      <div class="hint"><span data-i18n="panels.room_hint">点一下房间可以看名字</span></div>
    </div>

    <aside class="panel">
      <section class="card who">
        <img id="avatar" src="/static/avatar.png" alt="TA">
        <div class="who-text">
          <div class="name">TA</div>
          <div class="sub" id="where"><span data-i18n="panels.her_room">她的房间</span></div>
        </div>
        <span class="chip" id="emotion"><span data-i18n="panels.calm">平静</span></span>
      </section>

      <section class="card act">
        <div class="label"><span data-i18n="panels.activity_prefix">正在</span></div>
        <div class="value" id="activity"><span data-i18n="panels.in_room">窝在房间里</span></div>
      </section>

      <section class="card need">
        <div class="row"><span><span data-i18n="panels.hunger">饥饿</span></span><div class="bar"><i id="b-hunger"></i></div><b id="v-hunger">0</b></div>
        <div class="row"><span><span data-i18n="panels.thirst">口渴</span></span><div class="bar"><i id="b-thirst"></i></div><b id="v-thirst">0</b></div>
        <div class="row"><span><span data-i18n="panels.bowel">便意</span></span><div class="bar warm"><i id="b-bowel"></i></div><b id="v-bowel">0</b></div>
        <div class="row"><span><span data-i18n="panels.urinary_urge">尿意</span></span><div class="bar warm"><i id="b-bladder"></i></div><b id="v-bladder">0</b></div>
        <div class="row"><span><span data-i18n="panels.energy">精力</span></span><div class="bar cool"><i id="b-energy"></i></div><b id="v-energy">0</b></div>
        <div class="row"><span><span data-i18n="panels.mood">心情</span></span><div class="bar mood"><i id="b-mood"></i></div><b id="v-mood">0</b></div>
      </section>

      <section class="card user">
        <div class="label"><span data-i18n="panels.you">你</span></div>
        <div class="value" id="user-status"><span data-i18n="panels.no_conversation">还没说过话</span></div>
        <div class="hint" id="user-hint"></div>
      </section>

      <section class="card view">
        <img id="window" src="/bg/evening.jpg" alt="窗外" data-i18n-alt="panels.outside_window">
        <div class="cap" id="window-cap"><span data-i18n="panels.window_evening">她房间窗外 · 傍晚</span></div>
      </section>

      <section class="card log">
        <div class="label"><span data-i18n="panels.just_now">刚刚</span></div>
        <ul id="events"><li>——</li></ul>
      </section>
    </aside>
  </main>
</div>
<script src="/static/app.js?v=20"></script>
</body>
</html>
