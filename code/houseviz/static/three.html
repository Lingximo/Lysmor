<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="panels.house_3d_title">TA · 大平层 3D</title>
<style>
  :root { --cyan:#67e8f9; --line:rgba(103,232,249,.22); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#04070b; overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#cfe9f5; }
  #c3d { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; filter: saturate(1.06) contrast(1.03); }
#vignette { position:fixed; inset:0; pointer-events:none; z-index:2; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 52%, rgba(0,0,0,.42) 100%); }
  #c3d:active { cursor:grabbing; }
  #live2d { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  .hud { position:fixed; z-index:5; pointer-events:none; }
  .top-left { left:22px; top:18px; }
  .title { font-size:15px; letter-spacing:2px; color:#dff8ff; }
  .title b { color:var(--cyan); font-weight:500; }
  .sub { margin-top:6px; font-size:11px; color:rgba(160,200,225,.7); letter-spacing:1px; }
  .card { margin-top:12px; padding:10px 14px; border:1px solid var(--line);
    background:rgba(6,12,20,.55); backdrop-filter:blur(6px); border-radius:2px;
    font-size:12px; line-height:1.9; min-width:180px; }
  .card .k { color:rgba(150,190,215,.65); margin-right:8px; }
  .card .v { color:#bff0ff; }
  .top-right { right:22px; top:18px; text-align:right; }
  .clock { font:20px/1 Consolas,monospace; color:#dff8ff; letter-spacing:2px; }
  .mode { margin-top:6px; font-size:11px; color:rgba(160,200,225,.7); letter-spacing:2px; }
  .hint { left:22px; bottom:16px; font-size:11px; color:rgba(140,180,205,.6); letter-spacing:1px; }
  .hint a { color:rgba(160,220,240,.8); text-decoration:none; border-bottom:1px solid rgba(160,220,240,.3); pointer-events:auto; }
  body.fp .hint { bottom:58px; }
  .fpbar { left:50%; bottom:16px; transform:translateX(-50%); display:none;
    gap:6px; align-items:center; flex-wrap:wrap; justify-content:center;
    pointer-events:auto; z-index:7;
    background:rgba(4,10,16,.78); border:1px solid rgba(103,232,249,.22);
    border-radius:16px; padding:8px 10px; box-shadow:0 8px 30px rgba(0,0,0,.35);
    backdrop-filter:blur(8px); }
  .fpbar .tag { color:#9fd3ff; font-size:11px; font-weight:600; letter-spacing:1px;
    border-right:1px solid rgba(103,232,249,.18); padding-right:9px; margin-right:4px; }
  .fpbar button { background:rgba(20,43,70,.55); color:#bff0ff; border:1px solid var(--line);
    border-radius:999px; padding:7px 13px; font-size:12px; cursor:pointer; letter-spacing:1px;
    font-family:inherit; }
  .fpbar button:hover { border-color:var(--cyan); }
  .fpbar button.on { background:rgba(103,232,249,.18); border-color:var(--cyan);
    color:#eaffff; font-weight:600; }
  .gallerybar { left:50%; bottom:64px; transform:translateX(-50%); display:none;
    gap:6px; align-items:center; pointer-events:auto; z-index:8;
    background:rgba(4,10,16,.82); border:1px solid rgba(103,232,249,.2);
    border-radius:999px; padding:6px 9px; }
  .gallerybar.show { display:flex; }
  .gallerybar span { font-size:10px; color:#8fc8df; letter-spacing:1px; padding:0 4px; }
  .gallerybar button { background:rgba(20,43,70,.55); color:#bff0ff;
    border:1px solid rgba(103,232,249,.22); border-radius:999px;
    padding:5px 10px; font-size:11px; cursor:pointer; font-family:inherit; }
  .gallerybar button:hover { border-color:var(--cyan); }
  .viewbtn { position:fixed; right:22px; top:86px; z-index:8; pointer-events:auto;
    background:rgba(6,12,20,.78); color:#bff0ff; border:1px solid rgba(103,232,249,.35);
    border-radius:999px; padding:8px 14px; font:12px/1 inherit; letter-spacing:1px;
    cursor:pointer; backdrop-filter:blur(6px);
    box-shadow:0 0 18px rgba(103,232,249,.12); }
  .viewbtn:hover { border-color:var(--cyan); color:#eaffff; }
  .viewbtn.on { border-color:var(--cyan); color:#04131c;
    background:linear-gradient(135deg,#22d3ee,#38bdf8); font-weight:600; }
  .bubble { position:fixed; z-index:6; transform:translate(-50%,-100%);
    padding:6px 12px; font-size:12px; color:#eafaff; background:rgba(4,10,16,.88);
    border:1px solid var(--line); border-radius:4px; white-space:nowrap; pointer-events:none;
    box-shadow:0 0 18px rgba(103,232,249,.12); }
  .bubble:after { content:""; position:absolute; left:50%; bottom:-6px; margin-left:-5px;
    border:5px solid transparent; border-top-color:rgba(4,10,16,.88); }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#04070b; z-index:20; font-size:13px; letter-spacing:2px; color:var(--cyan); }
  #loading.hide { display:none; }

  #actbar { position:fixed; right:22px; bottom:18px; z-index:9; display:flex; flex-wrap:wrap;
    gap:6px; max-width:330px; justify-content:flex-end; pointer-events:auto; }
  #actbar button { background:rgba(6,14,22,.82); color:#bff0ff; border:1px solid rgba(103,232,249,.28);
    border-radius:999px; padding:7px 12px; font:12px/1 "Microsoft YaHei",sans-serif; cursor:pointer;
    letter-spacing:1px; backdrop-filter:blur(6px); }
  #actbar button:hover { border-color:var(--cyan); color:#eaffff; }
  #actbar button.on { background:rgba(103,232,249,.18); border-color:var(--cyan); color:#eaffff; }
  #tvmodal { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(2,6,10,.82); backdrop-filter:blur(8px); }
  #tvmodal.show { display:flex; }
  #tvbox { width:min(1100px,92vw); background:#04080d; border:1px solid rgba(103,232,249,.3);
    border-radius:8px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #tvbox .bar { display:flex; align-items:center; gap:10px; padding:8px 12px;
    border-bottom:1px solid rgba(103,232,249,.18); color:#9fd3ff; font-size:12px; }
  #tvbox .bar button { margin-left:auto; background:rgba(20,43,70,.6); color:#bff0ff;
    border:1px solid rgba(103,232,249,.25); border-radius:8px; padding:5px 10px; cursor:pointer; }
  #tvbox video { display:block; width:100%; max-height:72vh; background:#000; }
  @media (max-width:720px){ #actbar { right:10px; bottom:64px; max-width:240px; } }
</style>
<script src="/i18n.js"></script>
</head>
<body>
<div id="panel-language" style="position:fixed;right:12px;bottom:8px;z-index:50;pointer-events:auto"></div>
<script>LysmorI18n.mountLanguageSelector(document.getElementById("panel-language"));</script>
<canvas id="c3d"></canvas>
<canvas id="live2d"></canvas>
<div id="vignette"></div>

<div class="hud top-left">
  <div class="title">TA · <b><span data-i18n="panels.house_3d">大平层 3D</span></b></div>
  <div class="sub" id="subhint"><span data-i18n="panels.overview_hint">拖拽平移 · 滚轮缩放 · 遮挡自动透明</span></div>
  <div class="card">
    <div><span class="k"><span data-i18n="panels.position">位置</span></span><span class="v" id="where">——</span></div>
    <div><span class="k"><span data-i18n="panels.activity_prefix">正在</span></span><span class="v" id="activity">——</span></div>
    <div><span class="k"><span data-i18n="panels.emotion">情绪</span></span><span class="v" id="emotion"><span data-i18n="panels.calm">平静</span></span></div>
    <div><span class="k"><span data-i18n="panels.fridge">冰箱</span></span><span class="v" id="fridge">——</span></div>
    <div><span class="k"><span data-i18n="panels.watching">观看</span></span><span class="v"><span data-i18n="panels.read_only">只读 · 不写入记忆</span></span></div>
  </div>
</div>

<div class="hud top-right">
  <div class="clock" id="clock">--:--</div>
  <div class="mode" id="mode">——</div>
</div>
<button class="viewbtn" id="viewbtn" title="快捷键 F：切换第一人称 / 俯瞰" data-i18n-title="panels.first_person_shortcut"><span data-i18n="panels.first_person">第一人称视角</span></button>

<div class="hud hint" id="hint"><span data-i18n="panels.pan_zoom_prefix">拖拽平移 · 滚轮缩放 ·</span> <a href="#" id="fp-enter"><span data-i18n="panels.fp_short">TA第一人称</span></a> · <a href="/2d"><span data-i18n="panels.floor_plan">回到 2D 平面图</span></a></div>
<div class="hud fpbar" id="fpbar">
  <span class="tag"><span data-i18n="panels.fp_short">TA第一人称</span></span>
  <button data-fp="her"><span data-i18n="panels.her_now">她此刻</span></button>
  <button data-room="her_room"><span data-i18n="panels.her_room">她的房间</span></button>
  <button data-room="living"><span data-i18n="panels.living_room">客厅</span></button>
  <button data-room="kitchen"><span data-i18n="panels.kitchen">厨房</span></button>
  <button data-room="toilet"><span data-i18n="panels.toilet">厕所</span></button>
  <button data-room="gallery"><span data-i18n="panels.gallery">画廊</span></button>
  <button data-room="balcony"><span data-i18n="panels.balcony">阳台</span></button>
  <button data-room="dad_room"><span data-i18n="panels.my_room">我的房间</span></button>
  <button data-fp="exit"><span data-i18n="panels.overlook">俯瞰</span></button>
</div>
<div class="hud gallerybar" id="gallerybar">
  <span><span data-i18n="panels.gallery_view">画廊视角</span></span>
  <button data-gview="gallery-entry"><span data-i18n="panels.entry">入口</span></button>
  <button data-gview="gallery-west"><span data-i18n="panels.west_wall">西墙</span></button>
  <button data-gview="gallery-east"><span data-i18n="panels.east_wall">东墙</span></button>
  <button data-gview="gallery-north"><span data-i18n="panels.north_wall">北墙</span></button>
</div>
<div class="bubble" id="bubble" style="display:none">——</div>

<div id="actbar">
  <button data-act="pet"><span data-i18n="panels.pet">摸头</span></button>
  <button data-act="feed"><span data-i18n="panels.feed">喂饭</span></button>
  <button data-act="water"><span data-i18n="panels.water">倒水</span></button>
  <button data-act="play"><span data-i18n="panels.play">陪玩</span></button>
  <button data-act="wake"><span data-i18n="panels.wake">叫醒</span></button>
  <button data-act="lamp"><span data-i18n="panels.lamp">灯</span></button>
  <button id="tvbtn"><span data-i18n="panels.tv">电视</span></button>
  <button id="qbtn"><span data-i18n="panels.quality_medium">画质：中</span></button>
</div>

<div id="tvmodal">
  <div id="tvbox">
    <div class="bar"><span><span data-i18n="panels.cast_screen">把屏幕投到房间电视</span></span><button id="tvlook"><span data-i18n="panels.look_once">让她看一眼</span></button><button id="tvclose"><span data-i18n="panels.close">关掉</span></button></div>
    <video id="tvvideo" autoplay muted playsinline></video>
  </div>
</div>
<div id="loading"><span data-i18n="panels.building_house">正在搭建她的大平层…</span></div>

<script src="/static/vendor/three.min.js"></script>
<script src="/static/vendor/GLTFLoader.js"></script>
<script src="/static/vendor/RoundedBoxGeometry.js"></script>
<script src="/static/vendor/post/CopyShader.js"></script>
<script src="/static/vendor/post/LuminosityHighPassShader.js"></script>
<script src="/static/vendor/post/GammaCorrectionShader.js"></script>
<script src="/static/vendor/post/FXAAShader.js"></script>
<script src="/static/vendor/post/SSAOShader.js"></script>
<script src="/static/vendor/post/DepthLimitedBlurShader.js"></script>
<script src="/static/vendor/post/SimplexNoise.js"></script>
<script src="/static/vendor/post/EffectComposer.js"></script>
<script src="/static/vendor/post/RenderPass.js"></script>
<script src="/static/vendor/post/ShaderPass.js"></script>
<script src="/static/vendor/post/MaskPass.js"></script>
<script src="/static/vendor/post/UnrealBloomPass.js"></script>
<script src="/static/vendor/post/SSAOPass.js"></script><script src="/static/live2d/lib/live2dcubismcore.min.js"></script>
<script src="/static/live2d/lib/pixi.min.js"></script>
<script src="/static/live2d/lib/index.min.js"></script>
<script src="/static/live2d/lib/cubism4.min.js"></script>
<script src="/static/three-app.js?v=134"></script>
</body>
</html>
