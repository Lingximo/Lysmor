<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="playalong.title"></title>
<script src="/i18n.js"></script>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#070d18,#0b1220 60%,#0a0f1a);
  color:#dbeafe;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.5px}
#dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;background:#64748b;box-shadow:0 0 0 4px #64748b33}
#dot.on{background:#22c55e;box-shadow:0 0 0 4px #22c55e33}
#state{color:#9fb3cc;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{padding:11px 20px;border-radius:14px;border:1px solid rgba(120,170,255,.45);
  background:rgba(30,60,100,.45);color:#e6f3ff;font-size:14px;cursor:pointer}
button.primary{background:rgba(50,110,180,.6)}
button.danger{border-color:rgba(255,120,120,.5);background:rgba(120,40,40,.45)}
button:disabled{opacity:.5;cursor:default}
#tip{color:#7f93b8;font-size:12px;max-width:520px;text-align:center}
#log{max-width:560px;width:100%;max-height:160px;overflow:auto;background:rgba(10,18,30,.7);
  border:1px solid rgba(80,110,160,.3);border-radius:12px;padding:10px;font:12px/1.5 Consolas,monospace;color:#9fb3cc;white-space:pre-wrap}
</style></head><body>
<h1 data-i18n="playalong.title"></h1>
<select data-language-select></select>
<div id="state" role="status"><span id="dot"></span><span id="label"></span></div>
<div class="row">
  <button id="on" class="primary" data-i18n="playalong.start"></button>
  <button id="off" data-i18n="playalong.stop"></button>
  <button id="panic" class="danger" data-i18n="playalong.panic"></button>
</div>
<div id="tip" data-i18n="playalong.tip"></div>
<div id="log"></div>
<script type="module">
const { t, language } = window.LysmorI18n;
const dot = document.querySelector('#dot'), label = document.querySelector('#label');
const log = document.querySelector('#log'), entries = [];
let stateKey = 'common.loading', count = 0, refreshId = 0;

function renderLog() {
  log.textContent = entries.map(({time, action, result}) =>
    `[${time.toLocaleTimeString(language())}] ${t(action)} → ${t(result)}`).join('\n');
}
function renderState() { label.textContent = t(stateKey, {count}); }
window.addEventListener('lysmor:languagechange', () => { renderState(); renderLog(); });

async function request(path, options = {}) {
  return fetch('/api/companion/' + path, {...options, headers: {
    'Accept-Language': language(), ...options.headers
  }});
}
async function refresh() {
  const id = ++refreshId;
  let key = 'playalong.state_unavailable', active = false, total = 0;
  try {
    const response = await request('state');
    if (response.status === 401) key = 'http.auth.required';
    else if (response.ok) {
      const state = await response.json();
      if (typeof state.on === 'boolean') {
        active = state.on;
        key = active ? 'video.play_active' : 'video.play_off';
        if (active && state.pet_clients > 0) { key = 'playalong.pets'; total = state.pet_clients; }
        else if (active && state.overlay_pids?.length) { key = 'playalong.overlays'; total = state.overlay_pids.length; }
      }
    }
  } catch { key = 'playalong.state_unavailable'; }
  if (id !== refreshId) return;
  stateKey = key; count = total;
  dot.classList.toggle('on', active);
  renderState();
}
async function act(action, on) {
  let result = 'playalong.request_failed';
  try {
    const panic = on === undefined;
    const response = await request(panic ? 'panic' : 'toggle', panic ? {method:'POST'} : {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({on})
    });
    if (response.status === 401) result = 'http.auth.required';
    else if (response.ok) {
      const data = await response.json();
      if (on && data.ok === false && data.mode === 'none') result = 'http.error.pet_disconnected';
      else if (data.ok === true) {
        if (data.errors?.length || data.overlay?.startsWith('error')) result = 'playalong.incomplete';
        else if (data.screen?.ok === false || data.screen?.error) result = 'playalong.screen_failed';
        else result = 'playalong.done';
      }
    }
  } catch { result = 'playalong.request_failed'; }
  entries.unshift({time:new Date(), action, result});
  if (entries.length > 50) entries.pop();
  renderLog();
  await refresh();
}
document.querySelector('#on').onclick = () => act('playalong.start', true);
document.querySelector('#off').onclick = () => act('playalong.stop', false);
document.querySelector('#panic').onclick = () => act('playalong.panic');
renderState();
refresh(); setInterval(refresh, 5000);
</script></body></html>
