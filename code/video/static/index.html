<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#03050c">
  <title data-i18n="video.title"></title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2367e8f9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css?v=43">
</head>
<body>
  <div id="bg-a" class="bg-layer"></div>
  <div id="bg-b" class="bg-layer"></div>
  <div class="bg-shade"></div>
  <canvas id="stage"></canvas>
  <canvas id="live2d"></canvas>

  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>TA</h1>
        <p id="status" data-i18n="video.connecting"></p>
      </div>
    </div>
    <div class="badge"><span data-i18n="video.badge"></span> <span id="ver" style="opacity:.55;font-size:10px">v.1110-2125</span></div>
    <select data-language-select></select>
  </header>

  <main class="call">
    <div class="halo"></div>
    <div id="captions" class="captions"></div>
  </main>

  <div id="perm-bar" class="perm-bar" role="alertdialog" aria-labelledby="perm-txt" hidden>
    <div class="perm-dot" id="perm-dot"></div>
    <div class="perm-txt" id="perm-txt" data-i18n="video.check_permissions"></div>
    <button id="perm-allow" class="perm-btn" data-i18n="video.allow"></button>
    <button id="perm-open" class="perm-btn ghost" data-i18n="video.open_browser"></button>
    <button id="perm-x" class="perm-x" data-i18n-title="video.dismiss">×</button>
  </div>
  <footer class="controls">
    <div class="transcript" id="transcript"></div>
    <div class="meter-wrap">
      <span class="meter-label" data-i18n="video.microphone"></span>
      <div class="meter"><div id="mic-level"></div></div>
      <span id="meter-text" class="meter-text" data-i18n="video.not_started"></span>
      <button id="test-mic" class="test-mic" data-i18n="video.test_mic"></button>
    </div>
    <div class="row">
      <button id="mic" class="mic" data-i18n-title="video.mic_title">
        <span class="mic-icon">●</span>
        <span id="mic-label" data-i18n="video.speak"></span>
      </button>
      <button id="cam" class="cam" data-i18n-title="video.camera_title">
        <span class="cam-icon">◉</span>
        <span id="cam-label" data-i18n="video.see_me"></span>
      </button>
      <div class="textbar">
        <input id="input" type="text" data-i18n-placeholder="video.input" autocomplete="off">
        <button id="send" data-i18n="video.send"></button>
      </div>
    </div>
    <div class="cam-line">
      <span id="cam-state" class="cam-state" data-i18n="video.camera_off"></span>
      <div id="lens" class="lens" hidden role="group" data-i18n-label="video.choose_lens">
        <button type="button" data-lens="user" data-i18n-title="video.front_title" data-i18n="video.front"></button>
        <button type="button" data-lens="environment" data-i18n-title="video.rear_title" data-i18n="video.rear"></button>
      </div>
      <button id="speaker" class="speaker" data-i18n-title="video.speaker_title" data-i18n="video.speaker"></button>
    </div>
    <div class="seen" id="seen"></div>
    <div class="hint" id="hint" data-i18n="video.initial_hint"></div>
  </footer>

  <div id="cam-wrap" class="cam-wrap">
    <video id="selfview" playsinline muted autoplay></video>
    <span class="cam-tag" data-i18n="video.camera_tag"></span>
  </div>

  <script src="/i18n.js"></script>
  <script src="/static/live2d/lib/live2dcubismcore.min.js"></script>
  <script src="/static/live2d/lib/pixi.min.js"></script>
  <script src="/static/live2d/lib/index.min.js"></script>
  <script src="/static/live2d/lib/cubism4.min.js"></script>
  <script src="/static/live2d/live2d.js?v=28"></script>
  <script src="/static/live2d/moodface.js?v=9"></script>
  <script src="/static/facegaze.js?v=8"></script>
  <script src="/static/app.js?v=66"></script>
<script>if (location.search.indexOf("panel=1") >= 0) document.body.classList.add("panel");</script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(function(){}); }</script>
<div id="audiohelp" style="position:fixed;left:14px;bottom:14px;z-index:9999;display:flex;gap:8px;align-items:center;font-size:12px;color:#cbd5e1;">
  <button id="audiotest" type="button" style="padding:6px 12px;border-radius:10px;border:1px solid rgba(120,160,255,.5);background:rgba(20,30,50,.85);color:#dbeafe;cursor:pointer;" data-i18n="video.test_sound"></button>
  <span id="audiostate" data-i18n="video.untested"></span>
</div>
<script>
(function(){
  var btn=document.getElementById('audiotest'), st=document.getElementById('audiostate');
  function show(text){ try{st.removeAttribute('data-i18n'); st.textContent=text;}catch(e){} }
  btn.onclick=function(){
    try{
      var Ctx=window.AudioContext||window.webkitAudioContext;
      window.__atCtx=window.__atCtx||new Ctx();
      var ctx=window.__atCtx;
      var p=ctx.resume();
      var go=function(){
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.value=660;
        g.gain.value=0.08;
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime+0.35);
        show(vt('video.sound_played', {state:ctx.state}));
      };
      if(p&&p.then){p.then(go).catch(function(e){show(vt('video.context_denied', {error:e.name}));});}else{go();}
    }catch(e){ show(vt('video.playback_error', {error:e.name||e})); }
  };
})();
</script>
</body>
</html>
