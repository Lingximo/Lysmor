<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#03050c">
  <title>和TA视频</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2367e8f9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css?v=43">
</head>
<body>
  <div id="bg-a" class="bg-layer"></div>
  <div id="bg-b" class="bg-layer"></div>
  <div class="bg-shade"></div>
  <canvas id="stage"></canvas>
  <canvas id="live2d"></canvas>

  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>TA</h1>
        <p id="status">正在连接…</p>
      </div>
    </div>
    <div class="badge">视频通话 · Live2D <span id="ver" style="opacity:.55;font-size:10px">v.1110-2125</span></div>
  </header>

  <main class="call">
    <div class="halo"></div>
    <div id="captions" class="captions"></div>
  </main>

  <div id="perm-bar" class="perm-bar" role="alertdialog" aria-labelledby="perm-txt" hidden>
    <div class="perm-dot" id="perm-dot"></div>
    <div class="perm-txt" id="perm-txt">正在检查摄像头 / 麦克风权限…</div>
    <button id="perm-allow" class="perm-btn">允许摄像头和麦克风</button>
    <button id="perm-open" class="perm-btn ghost">在浏览器里打开</button>
    <button id="perm-x" class="perm-x" title="先不管">×</button>
  </div>
  <footer class="controls">
    <div class="transcript" id="transcript"></div>
    <div class="meter-wrap">
      <span class="meter-label">麦克风</span>
      <div class="meter"><div id="mic-level"></div></div>
      <span id="meter-text" class="meter-text">未开启</span>
      <button id="test-mic" class="test-mic">测麦克风</button>
    </div>
    <div class="row">
      <button id="mic" class="mic" title="点一下开始说话，再点一下结束">
        <span class="mic-icon">●</span>
        <span id="mic-label">点击说话</span>
      </button>
      <button id="cam" class="cam" title="打开摄像头，让她能看见你">
        <span class="cam-icon">◉</span>
        <span id="cam-label">让她看见我</span>
      </button>
      <div class="textbar">
        <input id="input" type="text" placeholder="也可以打字…" autocomplete="off">
        <button id="send">发送</button>
      </div>
    </div>
    <div class="cam-line">
      <span id="cam-state" class="cam-state">摄像头已关闭</span>
      <div id="lens" class="lens" hidden role="group" aria-label="选择镜头">
        <button type="button" data-lens="user" title="前置：拍你自己">前置</button>
        <button type="button" data-lens="environment" title="后置：拍你眼前的东西">后置</button>
      </div>
      <button id="speaker" class="speaker" title="声音小/听不到时点一下，切到外放并重播最近一句">外放</button>
    </div>
    <div class="seen" id="seen"></div>
    <div class="hint" id="hint">点一下麦克风开始，再点一下结束；第一次使用请允许麦克风</div>
  </footer>

  <div id="cam-wrap" class="cam-wrap">
    <video id="selfview" playsinline muted autoplay></video>
    <span class="cam-tag">她看到的你</span>
  </div>

  <script src="/static/live2d/lib/live2dcubismcore.min.js"></script>
  <script src="/static/live2d/lib/pixi.min.js"></script>
  <script src="/static/live2d/lib/index.min.js"></script>
  <script src="/static/live2d/lib/cubism4.min.js"></script>
  <script src="/static/live2d/live2d.js?v=28"></script>
  <script src="/static/live2d/moodface.js?v=9"></script>
  <script src="/static/facegaze.js?v=8"></script>
  <script src="/static/app.js?v=66"></script>
<script>if (location.search.indexOf("panel=1") >= 0) document.body.classList.add("panel");</script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(function(){}); }</script>
<div id="audiohelp" style="position:fixed;left:14px;bottom:14px;z-index:9999;display:flex;gap:8px;align-items:center;font-size:12px;color:#cbd5e1;">
  <button id="audiotest" type="button" style="padding:6px 12px;border-radius:10px;border:1px solid rgba(120,160,255,.5);background:rgba(20,30,50,.85);color:#dbeafe;cursor:pointer;">🔊 测试声音</button>
  <span id="audiostate">音频未测试</span>
</div>
<script>
(function(){
  var btn=document.getElementById('audiotest'), st=document.getElementById('audiostate');
  function show(t){ try{st.textContent=t;}catch(e){} }
  btn.onclick=function(){
    try{
      var Ctx=window.AudioContext||window.webkitAudioContext;
      window.__atCtx=window.__atCtx||new Ctx();
      var ctx=window.__atCtx;
      var p=ctx.resume();
      var go=function(){
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.value=660;
        g.gain.value=0.08;
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime+0.35);
        show('测试音已播出 · 上下文 '+ctx.state);
      };
      if(p&&p.then){p.then(go).catch(function(e){show('上下文被拒：'+e.name);});}else{go();}
    }catch(e){ show('播放失败：'+(e.name||e)); }
  };
})();
</script>
</body>
</html>
