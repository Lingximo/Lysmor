<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TA表情对照</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1720; color: #e8f1f8;
               font-family: "Microsoft YaHei", sans-serif; overflow: hidden; }
  #live2d { position: fixed; inset: 0; width: 100%; height: 100%; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px 14px;
         display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
         background: linear-gradient(transparent, rgba(15,23,32,.92) 40%); }
  button { background: #1d2f3f; color: #dbeaf6; border: 1px solid #2c455c;
           border-radius: 10px; padding: 7px 11px; font-size: 13px; cursor: pointer; }
  button:hover { background: #27435a; }
  button.active { background: #2f7d5c; border-color: #48b98a; }
  .tip { position: fixed; top: 10px; left: 0; right: 0; text-align: center;
         font-size: 13px; color: #8fa6b8; }
  .tip b { color: #9fd3ff; }
</style>
</head>
<body>
<canvas id="live2d"></canvas>
<div class="tip">点按钮换表情 · 现在情绪决定的是 <b id="now">—</b></div>
<div class="bar" id="bar"></div>

<script src="/static/live2d/lib/live2dcubismcore.min.js"></script>
<script src="/static/live2d/lib/pixi.min.js"></script>
<script src="/static/live2d/lib/index.min.js"></script>
<script src="/static/live2d/lib/cubism4.min.js"></script>
<script src="/static/live2d/live2d.js?compact=1"></script>
<script src="/static/live2d/moodface.js?v=1"></script>
<script>
  const NAMES = [
    ['', '中性'],
    ['exp01_mouth', '1 口型切换'],
    ['exp02_three_mouth', '2 三嘴'],
    ['exp02_grit', '2 龇牙'],
    ['exp03_dark', '3 脸黑'],
    ['exp04_blush', '4 脸红'],
    ['exp05_oo', '5 O_O'],
    ['exp05_brackets', '5 >v<'],
    ['exp06_xx', '6 X X 眼'],
    ['exp07_drool', '7 流口水'],
    ['exp08_omouth', '8 o 嘴'],
    ['exp08_chestnut', '8 栗子嘴'],
    ['exp08_worry', '8 委屈/担心'],
    ['exp11_tail_hide', '11 尾巴消失'],
    ['exp12_ear_hide', '12 耳朵消失'],
  ];
  const bar = document.getElementById('bar');
  for (const [name, label] of NAMES) {
    const b = document.createElement('button');
    b.textContent = label;
    b.dataset.name = name;
    b.onclick = () => {
      window.__companionLockExpression = true;   // 手动预览时先别让情绪覆盖
      window.setExpression?.(name);
      document.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    };
    bar.appendChild(b);
  }
  const follow = document.createElement('button');
  follow.textContent = '跟随情绪';
  follow.onclick = () => {
    window.__companionLockExpression = false;
  };
  bar.appendChild(follow);
  setInterval(() => {
    const mood = window.__companionMood;
    document.getElementById('now').textContent = mood
      ? `${mood.emotion_level || '?'} → ${mood.expression || '中性'}（${mood.expression_reason || ''}）`
      : '还没连上生命状态服务';
  }, 1500);
</script>
</body>
</html>
