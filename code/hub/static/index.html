<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d18">
<title>TA</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<style>
  :root{
    --bg:#070d18;--panel:#0d1626;--line:rgba(130,170,255,.14);
    --txt:#dbe7f7;--dim:#7c8ea6;--acc:#6aa8ff;--ok:#5ee0a0;--bad:#ff7a8a
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 700px at 20% -10%,#13203a 0,#070d18 60%);
       color:var(--txt);font:15px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       overflow:hidden}
  #app{height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
         background:rgba(7,13,24,.72);backdrop-filter:blur(10px);flex:0 0 auto}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  header .dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  header .dot.bad{background:var(--bad);box-shadow:0 0 10px var(--bad)}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .mood{color:var(--dim);font-size:12px}
  header .sp{flex:1}
  header .now{color:var(--dim);font-size:12px}
  nav{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;overflow:auto}
  nav button{background:transparent;border:1px solid transparent;color:var(--dim);font-size:14px;
             padding:7px 14px;border-radius:12px;cursor:pointer;white-space:nowrap}
  nav button.on{color:var(--txt);background:rgba(110,160,255,.12);border-color:rgba(130,170,255,.25)}
  main{flex:1;position:relative;min-height:0}
  .view{position:absolute;inset:0;display:none;overflow:auto}
  .view.on{display:block}
  iframe{width:100%;height:100%;border:0;background:#0b1220}
  .wrap{padding:18px;max-width:1200px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .card .k{color:var(--dim);font-size:12px}
  .card .v{font-size:20px;margin-top:2px}
  .card .s{color:var(--dim);font-size:11px;margin-top:4px}
  .bar{height:6px;border-radius:6px;background:rgba(130,170,255,.12);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#7ee0c0)}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
        border:1px solid var(--line);color:var(--dim);font-size:12px}
  .chip i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .chip.ok i{background:var(--ok)}
  .chip.bad i{background:var(--bad)}
  .gallery .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in}
  .gallery img{width:100%;height:150px;object-fit:contain;background:#fff;display:block}
  .gallery .cap{padding:6px 8px;font-size:11px;color:var(--dim)}
  .empty{color:var(--dim);text-align:center;padding:60px 20px}
  #applayer[hidden]{display:none!important}
  .apps{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .appcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;
           display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
  .appcard:hover{border-color:rgba(130,170,255,.4);transform:translateY(-1px)}
  .appcard .t{font-size:15px}
  .appcard .d{color:var(--dim);font-size:12px}
  footer{display:none}
  @media (max-width:720px){
    header h1{font-size:15px}
    header .now{display:none}
    nav{position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;
        background:rgba(7,13,24,.94);border-top:1px solid var(--line);padding:6px 4px}
    nav button{flex:1;text-align:center;padding:8px 4px}
    main{padding-bottom:52px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <i class="dot" id="dot"></i>
    <h1>TA</h1>
    <span class="mood" id="mood" data-i18n="primary.hub.connecting"></span>
    <span class="sp"></span>
    <span class="now" id="now"></span>
    <select data-language-select></select>
  </header>

  <nav id="nav">
    <button data-v="all" class="on" data-i18n="primary.hub.all"></button>
    <button data-v="life" data-i18n="primary.hub.status"></button>
    <button data-v="ops" data-i18n="primary.hub.observe"></button>
  </nav>

  <main>
    <section class="view on" id="v-chat">
      <iframe id="fr-chat" data-i18n-title="primary.hub.frame_chat" loading="lazy" allow="camera; microphone; display-capture"></iframe>
    </section>
    <section class="view" id="v-call">
      <iframe id="fr-call" data-i18n-title="primary.hub.frame_video" loading="lazy" allow="camera; microphone; display-capture"></iframe>
    </section>

    <section class="view" id="v-ops">
      <div class="wrap">
        <div class="grid" id="ops-cards"></div>
        <div style="height:16px"></div>
        <div class="card">
          <div class="k" style="margin-bottom:8px" data-i18n="primary.hub.recent_turns"></div>
          <div id="ops-recent" style="font-size:12px;color:#9fb3c8;line-height:1.9"></div>
        </div>
      </div>
    </section>

    <section class="view" id="v-life">
      <div class="wrap">
        <div class="row" id="chips" style="margin-bottom:14px"></div>
        <div class="grid" id="cards"></div>
        <div style="height:14px"></div>
        <div class="card" id="services"></div>
      </div>
    </section>

    <section class="view" id="v-all">
      <div class="wrap">
        <div class="card" id="outing" style="margin-bottom:14px;border-color:rgba(255,170,90,.28);background:linear-gradient(135deg,rgba(50,28,18,.7),rgba(13,22,38,.9))">
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
            <div style="flex:1;min-width:210px">
              <div class="k" data-i18n="primary.hub.outing"></div>
              <div id="outing-state" style="font-size:13px;color:var(--dim);margin-top:3px" data-i18n="primary.hub.reading_camera"></div>
            </div>
            <button id="outing-btn" style="background:rgba(255,150,60,.16);border:1px solid rgba(255,170,90,.5);color:#ffd7b0;border-radius:12px;padding:10px 18px;font-size:14px;cursor:pointer" data-i18n="primary.hub.outing"></button>
          </div>
        </div>
        <div class="grid apps" id="apps"></div>
      </div>
    </section>

    <section class="view" id="v-gallery">
      <div class="wrap">
        <div class="row" style="margin-bottom:12px">
          <span class="chip" id="artcount" data-i18n="primary.hub.gallery"></span>
        </div>
        <div class="grid gallery" id="gallery"></div>
        <div class="empty" id="artempty" hidden data-i18n="primary.hub.no_art"></div>
      </div>
    </section>
  </main>

  <div id="applayer" hidden style="position:fixed;inset:0;z-index:50;background:#070d18;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)">
      <button id="appback" style="background:rgba(110,160,255,.12);border:1px solid rgba(130,170,255,.25);color:var(--txt);border-radius:10px;padding:6px 12px;cursor:pointer" data-i18n="primary.hub.back"></button>
      <b id="apptitle" style="font-size:14px"></b>
    </div>
    <iframe id="appframe" style="flex:1;width:100%;border:0;background:#0b1220" allow="camera; microphone; display-capture; fullscreen"></iframe>
  </div>
</div>

<script src="/i18n.js"></script>
<script>
const I18N = window.LysmorI18n;
const t = I18N.t;
const host = location.hostname || '127.0.0.1';
const VIDEO_TOK = '__VIDEO_TOK__';

// 所有网页入口（端口 + 名字 + 说明）
const APPS = [
  {t:'primary.hub.app_now',    d:'primary.hub.app_now_description', p:8009, path:'/she'},
  {t:'primary.hub.app_house3d',   d:'primary.hub.app_house3d_description', p:8007, path:'/3d'},
  {t:'primary.hub.app_house2d',   d:'primary.hub.app_house2d_description',            p:8007, path:'/2d'},
  {t:'primary.hub.app_life',    d:'primary.hub.app_life_description',   p:8005, path:'/'},
  {t:'primary.hub.app_brain',        d:'primary.hub.app_brain_description',       p:8006, path:'/'},
  {t:'primary.hub.app_doodle',      d:'primary.hub.app_doodle_description',           p:8002, path:'/'},
  {t:'primary.hub.app_chat',    d:'primary.hub.app_chat_description',        p:8001, path:'/'},
  {t:'primary.hub.app_diary',    d:'primary.hub.app_diary_description',     p:8003, path:'/her-notes', tok:VIDEO_TOK},
  {t:'primary.hub.app_play',        d:'primary.hub.app_play_description',       p:8003, path:'/playalong', tok:VIDEO_TOK},
  {t:'primary.hub.app_video',    d:'primary.hub.app_video_description',       p:8003, path:'/', tok:VIDEO_TOK},
  {t:'primary.hub.app_qq',     d:'primary.hub.app_qq_description',     p:8008, path:'/'},
  {t:'primary.hub.app_console',      d:'primary.hub.app_console_description',      p:8012, path:'/'},
];

function renderApps(){
  const g = document.getElementById('apps');
  g.replaceChildren();
  for (const a of APPS){
    const c = el('div','appcard');
    c.appendChild(el('div','t', t(a.t)));
    c.appendChild(el('div','d', t(a.d) + ' · ' + a.p));
    c.onclick = ()=> openApp(a);
    g.appendChild(c);
  }
}

function openApp(a){
  const layer = document.getElementById('applayer');
  const frame = document.getElementById('appframe');
  document.getElementById('apptitle').dataset.i18n = a.t;
  document.getElementById('apptitle').textContent = t(a.t);
  let url = `http://${host}:${a.p}${a.path||'/'}`;
  url += (url.includes('?')?'&':'?') + 'lang=' + encodeURIComponent(I18N.language());
  if (a.tok) url += (url.includes('?')?'&':'?') + 't=' + encodeURIComponent(a.tok);
  frame.src = url;
  layer.hidden = false;
}
document.getElementById('appback').onclick = ()=>{
  const layer = document.getElementById('applayer');
  document.getElementById('appframe').src = 'about:blank';
  layer.hidden = true;
};
let current = 'chat';

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

// ---------- 导航 ----------
function activate(v, push){
  current = v;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on', x.id==='v-'+v));
  if (v==='chat') loadFrame('fr-chat', `http://${host}:8001/?lang=${encodeURIComponent(I18N.language())}`);
  if (v==='call') loadFrame('fr-call', `http://${host}:8003/?t=${encodeURIComponent(VIDEO_TOK)}&lang=${encodeURIComponent(I18N.language())}`);
  if (v==='life') refreshStatus();
  if (v==='gallery') refreshArt();
  if (v==='all') renderApps();
  if (v==='ops') refreshOps();
  if (push !== false) history.replaceState(null, '', '#'+v);
}
document.getElementById('nav').addEventListener('click', (e)=>{
  const b = e.target.closest('button'); if(!b) return;
  activate(b.dataset.v);
});
window.addEventListener('hashchange', ()=>{ const v=location.hash.slice(1); if(['life','all','ops'].includes(v)) activate(v, false); });
function loadFrame(id, src){
  const f = document.getElementById(id);
  if (f.dataset.src !== src){ f.dataset.src = src; f.src = src; }
}

// ---------- 状态 ----------
const LABELS = {
  emotion_level:'primary.hub.label_emotion_level', energy:'primary.hub.label_energy', hunger:'primary.hub.label_hunger', thirst:'primary.hub.label_thirst', asleep:'primary.hub.label_asleep',
  adenosine:'primary.hub.label_adenosine', cortisol:'primary.hub.label_cortisol', valence:'primary.hub.label_valence', happiness:'primary.hub.label_happiness', sadness:'primary.hub.label_sadness',
  lymph_edema:'primary.hub.label_lymph_edema', lymph_tenderness:'primary.hub.label_lymph_tenderness', lymph_flow:'primary.hub.label_lymph_flow',
  lymph_capacity:'primary.hub.label_lymph_capacity', cycle_phase:'primary.hub.label_cycle_phase', cycle_day:'primary.hub.label_cycle_day',
  activity:'primary.hub.label_activity', sick_recovery:'primary.hub.label_sick_recovery'
};
const CYCLE = {follicular:'primary.hub.cycle_follicular', ovulation:'primary.hub.cycle_ovulation', luteal:'primary.hub.cycle_luteal',
               premenstrual:'primary.hub.cycle_premenstrual', menstrual:'primary.hub.cycle_menstrual'};
function fmt(k, v){
  if (v == null) return '—';
  if (k === 'cycle_phase') return CYCLE[v] ? t(CYCLE[v]) : v;
  if (k === 'asleep') return v ? t('primary.hub.asleep') : t('primary.hub.awake');
  if (k === 'activity') return v || '—';
  if (typeof v === 'number') return (Math.abs(v) <= 1 ? v.toFixed(2) : String(v));
  return String(v);
}
function bar(v){
  const d = el('div','bar'); const i = el('i'); 
  i.style.width = Math.max(0, Math.min(1, Number(v)||0))*100 + '%';
  d.appendChild(i); return d;
}
async function refreshStatus(){
  try{
    const r = await fetch('/api/status', {cache:'no-store'});
    const j = await r.json();
    const her = j.her || {};
    const ok = (j.services||[]).filter(s=>s.ok).length, total=(j.services||[]).length;
    document.getElementById('dot').className = 'dot ' + (ok===total?'ok':'bad');
    document.getElementById('mood').textContent =
      t('primary.hub.summary', {mood: her.emotion_level||'—', energy: fmt('energy',her.energy), count: j.memory?.documents ?? '—'});
    document.getElementById('now').textContent = new Date().toLocaleTimeString(I18N.language(),{hour:'2-digit',minute:'2-digit'});

    // 服务
    const sv = document.getElementById('services');
    sv.innerHTML = '';
    sv.appendChild(el('div', 'k', t('primary.hub.services')));
    const row = el('div','row');
    for (const s of j.services||[]){
      const c = el('span','chip '+(s.ok?'ok':'bad'));
      c.appendChild(el('i')); c.appendChild(document.createTextNode(`${s.name} ${s.port}`));
      row.appendChild(c);
    }
    sv.appendChild(row);

    // 卡片
    const cards = document.getElementById('cards');
    cards.innerHTML = '';
    const keys = ['emotion_level','energy','hunger','thirst','asleep','adenosine','cortisol',
                  'lymph_edema','lymph_tenderness','cycle_phase'];
    if (j.self && j.self.summary){
      const c = el('div','card');
      c.appendChild(el('div','k',t('primary.hub.self')));
      c.appendChild(el('div','v', j.self.narrative || j.self.summary));
      cards.appendChild(c);
    }
    for (const k of keys){
      const c = el('div','card');
      c.appendChild(el('div','k', LABELS[k] ? t(LABELS[k]) : k));
      c.appendChild(el('div','v', fmt(k, her[k])));
      if (typeof her[k] === 'number' && k!=='cycle_day' && k!=='cycle_phase') c.appendChild(bar(her[k]));
      cards.appendChild(c);
    }
  }catch(e){
    document.getElementById('dot').className='dot bad';
    document.getElementById('mood').textContent=t('primary.hub.backend_down');
  }
}

// ---------- 画廊 ----------
async function refreshArt(){
  try{
    const r = await fetch('/api/art', {cache:'no-store'});
    const j = await r.json();
    const items = j.items || [];
    document.getElementById('artcount').textContent = t('primary.art_count', {count: items.length});
    document.getElementById('artempty').hidden = items.length > 0;
    const g = document.getElementById('gallery');
    g.innerHTML = '';
    for (const it of items){
      const name = it.sketch || it.doodle;
      if (!name) continue;
      const card = el('div','item');
      const im = el('img'); im.loading='lazy'; im.src = '/artimg?name='+encodeURIComponent(name);
      im.onclick = ()=> window.open(im.src,'_blank');
      card.appendChild(im);
      const cap = el('div','cap', (it.time||'').slice(0,4)+'-'+(it.time||'').slice(4,6)+'-'+(it.time||'').slice(6,8)+' '+((it.kind==='art')?t('primary.hub.paint'):t('primary.hub.app_doodle')));
      card.appendChild(cap);
      g.appendChild(card);
    }
  }catch(e){}
}

// ---------- 观测 ----------
async function refreshOps(){
  try{
    const r = await fetch('/api/ops', {cache:'no-store'});
    const j = await r.json();
    const cards = document.getElementById('ops-cards');
    cards.innerHTML = '';
    const add = (k, v, s) => {
      const c = el('div','card'); c.appendChild(el('div','k',k));
      c.appendChild(el('div','v',v)); if(s) c.appendChild(el('div','s',s));
      cards.appendChild(c);
    };
    add(t('primary.hub.turns'), j.turns);
    add(t('primary.hub.latency'), j.avg_latency_ms + ' ms');
    add(t('primary.hub.selected'), j.avg_selected);
    add(t('primary.hub.chars'), j.avg_chars);
    add(t('primary.hub.total'), (j.memory && j.memory.documents) ?? '—');
    for (const [k,v] of Object.entries(j.by_src||{})) add(t('primary.hub.source', {source: k}), v);
    const rec = document.getElementById('ops-recent');
    rec.innerHTML = '';
    for (const e of j.recent||[]){
      const t = new Date((e.ts||0)*1000).toLocaleTimeString(I18N.language(),{hour:'2-digit',minute:'2-digit'});
      rec.appendChild(el('div', '', I18N.t('primary.hub.recent', {time: t, source: e.src||'', candidates: e.candidates??'-', selected: e.selected??'-', latency: e.latency_ms??'-', chars: e.chars??'-', mood: e.emotion||''})));
    }
  }catch(e){}
}

// ---------- 带TA出门 ----------
let outingOn = false;
async function refreshOuting(){
  try{
    const r = await fetch('/api/camera_source', {cache:'no-store'});
    const j = await r.json();
    outingOn = (j.source === 'pico');
    paintOuting();
  }catch(e){}
}
function paintOuting(){
  const b = document.getElementById('outing-btn');
  const s = document.getElementById('outing-state');
  if (!b || !s) return;
  if (outingOn){
    b.textContent = t('primary.hub.home');
    b.style.background = 'rgba(90,220,160,.16)';
    b.style.borderColor = 'rgba(90,220,160,.55)';
    b.style.color = '#b8ffd9';
    s.textContent = t('primary.hub.outside');
  }else{
    b.textContent = t('primary.hub.outing');
    b.style.background = 'rgba(255,150,60,.16)';
    b.style.borderColor = 'rgba(255,170,90,.5)';
    b.style.color = '#ffd7b0';
    s.textContent = t('primary.hub.inside');
  }
}
document.getElementById('outing-btn').onclick = async ()=>{
  const b = document.getElementById('outing-btn');
  b.disabled = true;
  try{
    const r = await fetch('/api/camera_source', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({on: !outingOn})
    });
    const j = await r.json();
    outingOn = (j.source === 'pico');
    paintOuting();
  }catch(e){
    document.getElementById('outing-state').textContent = t('primary.hub.switch_failed', {error: e.message||e});
  }finally{ b.disabled = false; }
};
refreshOuting();

window.addEventListener('lysmor:languagechange', ()=>{
  renderApps(); refreshStatus(); paintOuting();
  if(current==='ops') refreshOps();
  if(current==='gallery') refreshArt();
});

// ---------- 启动 ----------
{ const v = location.hash.slice(1); activate(['life','all','ops'].includes(v) ? v : 'all', false); }
refreshStatus(); setInterval(()=>{ if(current==='life') refreshStatus(); }, 5000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
