<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TA · 简笔画画廊</title>
<style>
  :root{--bg:#070d18;--card:#0d1626;--line:rgba(130,170,255,.14);--txt:#dbe7f7;--dim:#7c8ea6;--acc:#6aa8ff}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 20% -10%,#13203a 0,#070d18 60%);color:var(--txt);
       font:15px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  header{position:sticky;top:0;z-index:5;backdrop-filter:blur(10px);background:rgba(7,13,24,.72);
         border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px}
  header .dot{width:9px;height:9px;border-radius:50%;background:#5ee0a0;box-shadow:0 0 10px #5ee0a0}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px}
  header .sub{color:var(--dim);font-size:12px}
  main{padding:22px;max-width:1500px;margin:0 auto}
  .empty{color:var(--dim);text-align:center;padding:80px 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
        box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .pair{display:grid;grid-template-columns:1fr 1fr}
  .pair figure{margin:0;position:relative;background:#fff;cursor:zoom-in}
  .pair img{width:100%;height:240px;object-fit:contain;display:block;background:#fff}
  .pair figcaption{position:absolute;left:8px;bottom:6px;font-size:11px;color:#4a5b74;
                   background:rgba(255,255,255,.82);padding:1px 7px;border-radius:8px}
  .meta{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);
        font-size:12px;color:var(--dim)}
  .meta b{color:var(--txt);font-weight:500}
</style>
</head>
<body>
<header>
  <i class="dot"></i>
  <h1>TA · 简笔画画廊</h1>
  <span class="sub">陪玩时随手画的 · 铅笔草稿 / 上色</span>
</header>
<main>
  <div id="stat" class="sub" style="color:#7c8ea6;margin-bottom:14px"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>还没画过简笔画</div>
</main>
<script>
const fmt = t => t ? t.slice(0,4)+'-'+t.slice(4,6)+'-'+t.slice(6,8)+' '+t.slice(8,10)+':'+t.slice(10,12) : '';
async function load(){
  const r = await fetch('/api/doodles');
  const list = await r.json();
  document.getElementById('stat').textContent = list.length ? ('共 ' + list.length + ' 幅') : '';
  document.getElementById('empty').hidden = list.length > 0;
  const g = document.getElementById('grid'); g.innerHTML = '';
  for (const it of list){
    const card = document.createElement('div'); card.className = 'card';
    const pair = document.createElement('div'); pair.className = 'pair';
    const add = (name, label) => {
      if (!name) return;
      const f = document.createElement('figure');
      const im = document.createElement('img'); im.loading = 'lazy';
      im.src = '/art/' + encodeURIComponent(name);
      f.onclick = () => window.open(im.src, '_blank');
      f.appendChild(im);
      const c = document.createElement('figcaption'); c.textContent = label; f.appendChild(c);
      pair.appendChild(f);
    };
    add(it.doodle, '草稿'); add(it.sketch, '上色');
    card.appendChild(pair);
    const meta = document.createElement('div'); meta.className = 'meta';
    const b = document.createElement('b'); b.textContent = fmt(it.time);
    meta.appendChild(b); card.appendChild(meta);
    g.appendChild(card);
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
